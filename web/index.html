<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#07130f"><meta name="description" content="A local AI assistant for building, running and testing Spring Boot projects with Ollama.">
<title>SpringBoot Agent · by Vetrivel Balakrishnan</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 44 64'%3E%3Cpath d='M22 12C22 2 34 0 40 4C38 14 28 16 22 12Z' fill='%232E9E5B'/%3E%3Cpath d='M22 12V16L10 22L34 30L10 38L34 46L10 54L22 58V62' fill='none' stroke='%2310281F' stroke-width='5' stroke-linejoin='round' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>

:root{
  color-scheme:dark;
  --bg:#07130f;--panel:#0d1d17;--panel-2:#11251c;--panel-3:#172e23;
  --line:rgba(191,222,199,.13);--line-strong:rgba(191,222,199,.22);
  --ink:#eef7ef;--muted:#9db4a4;--muted-2:#718b79;
  --green:#72d69a;--green-2:#35b875;--green-soft:rgba(87,204,135,.12);
  --amber:#f1c36b;--amber-soft:rgba(241,195,107,.13);
  --red:#ff8978;--red-soft:rgba(255,137,120,.12);
  --display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --body:'IBM Plex Sans','Segoe UI',system-ui,sans-serif;
  --mono:'JetBrains Mono',Consolas,monospace;
  --shadow:0 24px 70px rgba(0,0,0,.28);
}
*{box-sizing:border-box}
html,body,#root{height:100%;margin:0}
body{font-family:var(--body);color:var(--ink);background:var(--bg);font-size:14px;line-height:1.55}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 75% -10%,rgba(52,153,97,.16),transparent 42%),radial-gradient(ellipse at 0% 100%,rgba(35,111,76,.10),transparent 35%)}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--green);outline-offset:3px}
.app{position:relative;z-index:1;display:grid;grid-template-columns:280px minmax(0,1fr);height:100%;max-width:1920px;margin:auto}
.side{background:rgba(9,25,18,.94);border-right:1px solid var(--line);color:var(--ink);display:flex;flex-direction:column;min-height:0;backdrop-filter:blur(20px)}
.brand{display:flex;gap:13px;align-items:center;padding:23px 20px 20px;border-bottom:1px solid var(--line)}
.brand h1{font-family:var(--display);font-weight:800;font-size:19px;line-height:1.1;margin:0;color:#f5fff6;letter-spacing:-.03em}
.brand small{display:block;margin-top:5px;font-size:11px;color:var(--muted);letter-spacing:.02em}
.side-head{display:flex;justify-content:space-between;align-items:center;padding:20px 18px 10px}
.side-head h2{margin:0;font-family:var(--display);font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.12em}
.icon-btn{background:var(--panel-2);border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:6px 10px;font-size:11px;transition:.2s}
.icon-btn:hover{background:var(--panel-3);color:var(--ink);border-color:var(--line-strong)}
.tree{flex:1;overflow:auto;padding:2px 12px 14px;font-family:var(--mono);font-size:11.5px}
.tree-empty{padding:14px 10px;color:var(--muted-2);font-size:12px;line-height:1.7}
.node{display:block;width:100%;text-align:left;background:none;border:0;color:#c7d9cc;padding:5px 8px;border-radius:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.node.file:hover{background:var(--green-soft);color:var(--green)}
.node.dir{color:#80c99a;cursor:default}
.node.fresh{animation:fresh 1.6s ease-out}
@keyframes fresh{0%{background:rgba(114,214,154,.35)}100%{background:transparent}}
.side-foot{border-top:1px solid var(--line);padding:16px 18px 18px;font-size:12px;background:rgba(255,255,255,.015)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;cursor:pointer;color:#d6e6d9}
.switch input{position:absolute;opacity:0}
.track{width:38px;height:21px;border-radius:99px;background:#294235;position:relative;transition:background .25s;flex:none}
.track:after{content:"";position:absolute;top:3px;left:3px;width:15px;height:15px;border-radius:50%;background:#dce9df;transition:transform .25s}
.switch input:checked+.track{background:var(--green-2)}
.switch input:checked+.track:after{transform:translateX(17px);background:#fff}
.switch input:focus-visible+.track{outline:2px solid var(--green);outline-offset:3px}
.credit{color:var(--muted-2);font-size:11px;line-height:1.7}
.credit b{color:#c9dfcf;font-weight:600}
.main{display:flex;flex-direction:column;min-width:0;min-height:0;position:relative}
.bar{display:flex;align-items:center;gap:10px;padding:14px 26px;background:rgba(8,21,15,.72);border-bottom:1px solid var(--line);backdrop-filter:blur(18px);min-height:64px}
.bar .menu{display:none}
.chip{display:inline-flex;align-items:center;gap:8px;padding:6px 11px;border-radius:8px;background:rgba(255,255,255,.035);border:1px solid var(--line);font-size:11px;color:#b9cbbd}
.chip .dot{width:7px;height:7px;border-radius:50%;background:#718b79}
.chip .dot.on{background:var(--green);box-shadow:0 0 0 4px rgba(114,214,154,.10);animation:ping 1.8s infinite}
.chip .dot.busy{background:var(--amber)}
.chip .dot.off{background:var(--red)}
@keyframes ping{70%{box-shadow:0 0 0 8px rgba(114,214,154,0)}100%{box-shadow:0 0 0 0 rgba(114,214,154,0)}}
.spacer{flex:1}
.bar-btn{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:9px;padding:7px 12px;color:#c7d9cc;font-size:12px;transition:.2s}
.bar-btn:hover:not(:disabled){background:var(--green-soft);border-color:rgba(114,214,154,.35);color:var(--green)}
.bar-btn:disabled{opacity:.35;cursor:not-allowed}
.scroll{flex:1;overflow:auto;padding:30px 28px 14px;scroll-behavior:smooth}
.col{max-width:900px;margin:0 auto}
.hero{text-align:center;padding:5vh 0 20px}
.hero .big-spring{width:78px;height:auto;display:block;margin:0 auto 10px;filter:drop-shadow(0 10px 24px rgba(53,184,117,.2))}
.hero h2{font-family:var(--display);font-weight:800;font-size:clamp(36px,5.5vw,58px);line-height:1;margin:14px 0 12px;letter-spacing:-.045em;color:#f1fff3}
.hero p{margin:0 auto;max-width:54ch;color:var(--muted);font-size:15px;line-height:1.8}
.hero .byline{margin-top:12px;font-size:12px;color:var(--muted-2)}
.hero .byline b{color:#d4e9d9;font-weight:600}
.starters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:34px auto 0;max-width:820px;text-align:left}
.starter{min-height:140px;background:linear-gradient(145deg,rgba(22,47,34,.92),rgba(12,29,21,.94));border:1px solid var(--line);border-radius:14px;padding:17px 16px;color:var(--ink);text-align:left;transition:transform .2s,border-color .2s,background .2s;display:flex;flex-direction:column;justify-content:space-between}
.starter:hover{transform:translateY(-3px);border-color:rgba(114,214,154,.42);background:linear-gradient(145deg,rgba(27,61,42,.96),rgba(12,29,21,.98))}
.starter:before{content:"↗";align-self:flex-end;color:var(--green);font-size:17px}
.starter strong{display:block;font-family:var(--display);font-weight:700;font-size:15px;margin:4px 0 7px;color:#f0fbf1}
.starter span{color:var(--muted);font-size:11.5px;line-height:1.55}
.spring{overflow:visible}
.spring .coil{transform-box:fill-box;transform-origin:50% 100%}
.spring.bounce .coil{animation:squash 1.05s cubic-bezier(.4,0,.3,1) infinite}
.spring.drop{animation:drop 1.2s cubic-bezier(.3,1.5,.5,1) both}
.spring.drop .coil{animation:squash-once 1.2s ease-out .35s both}
.spring .leaf{transform-box:fill-box;transform-origin:0% 100%}
.spring.bounce .leaf{animation:sway 1.05s ease-in-out infinite}
@keyframes squash{0%,100%{transform:scaleY(1)}30%{transform:scaleY(.62)}60%{transform:scaleY(1.12)}80%{transform:scaleY(.96)}}
@keyframes squash-once{0%{transform:scaleY(1)}35%{transform:scaleY(.55)}65%{transform:scaleY(1.1)}85%{transform:scaleY(.97)}100%{transform:scaleY(1)}}
@keyframes sway{0%,100%{transform:rotate(0)}40%{transform:rotate(-14deg)}65%{transform:rotate(8deg)}}
@keyframes drop{0%{transform:translateY(-70px);opacity:0}40%{opacity:1}100%{transform:translateY(0)}}
.feed{position:relative;padding-left:30px}
.feed:before{content:"";position:absolute;left:9px;top:6px;bottom:6px;width:2px;border-radius:3px;background:linear-gradient(var(--line-strong),rgba(114,214,154,.18),var(--line))}
.item{position:relative;margin-bottom:17px;animation:enter .3s ease-out both}
@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.pin{position:absolute;left:-30px;top:13px;width:20px;height:20px;border-radius:50%;background:var(--panel);border:3px solid var(--green);z-index:1;box-shadow:0 0 0 4px var(--bg)}
.pin.you{border-color:#7894ff}.pin.run{border-color:var(--amber);animation:pulse 1.2s ease-in-out infinite}.pin.bad{border-color:var(--red)}.pin.ask{border-color:var(--amber);background:var(--amber)}.pin.ok{background:var(--green)}
@keyframes pulse{50%{transform:scale(1.2);box-shadow:0 0 0 8px rgba(241,195,107,.09)}}
.you-msg{background:linear-gradient(120deg,#183a2a,#122b20);color:#effaf0;border:1px solid rgba(114,214,154,.16);border-radius:14px 14px 14px 4px;padding:13px 17px;white-space:pre-wrap;box-shadow:0 8px 25px rgba(0,0,0,.12)}
.bot-msg{background:rgba(17,37,27,.92);border:1px solid var(--line);border-radius:14px 14px 14px 4px;padding:16px 19px;box-shadow:0 8px 25px rgba(0,0,0,.10);color:#dce9df}
.bot-msg p{margin:0 0 10px}.bot-msg p:last-child{margin:0}
.bot-msg code,.you-msg code{font-family:var(--mono);font-size:12px;background:rgba(114,214,154,.13);color:#a6e8b9;padding:2px 6px;border-radius:5px}
.you-msg code{background:rgba(255,255,255,.1);color:#e4f5e8}
pre.block{margin:10px 0;background:#06100c;color:#c8e7d0;border:1px solid rgba(191,222,199,.10);border-radius:10px;padding:14px 16px;overflow:auto;font-family:var(--mono);font-size:11.5px;line-height:1.7}
.reveal{animation:reveal .6s ease-out both}
@keyframes reveal{from{clip-path:inset(0 0 100% 0);opacity:0}to{clip-path:inset(0 0 0 0);opacity:1}}
.tool{background:rgba(16,35,25,.94);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.tool-head{display:flex;align-items:center;gap:11px;width:100%;padding:12px 15px;background:none;border:0;text-align:left;color:var(--ink)}
.tool-head:hover{background:rgba(255,255,255,.025)}
.tool-name{font-family:var(--display);font-weight:700;font-size:13px;white-space:nowrap;text-transform:capitalize}
.tool-sum{font-family:var(--mono);font-size:10.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.badge{font-size:10px;font-weight:700;padding:3px 8px;border-radius:6px;white-space:nowrap;letter-spacing:.02em}
.badge.run{background:var(--amber-soft);color:var(--amber)}.badge.ok{background:var(--green-soft);color:var(--green)}.badge.bad{background:var(--red-soft);color:var(--red)}
.caret{transition:transform .25s;color:var(--muted)}.open .caret{transform:rotate(90deg)}
.tool-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s ease}.open .tool-body{grid-template-rows:1fr}.tool-body>div{overflow:hidden}
.tool-body pre.block{margin:0;border:0;border-top:1px solid var(--line);border-radius:0;max-height:300px;white-space:pre-wrap;word-break:break-word}
.bar-run{height:2px;background:linear-gradient(90deg,transparent,var(--amber),transparent);background-size:200% 100%;animation:slide 1.2s linear infinite}
@keyframes slide{from{background-position:200% 0}to{background-position:-200% 0}}
.think{display:flex;align-items:center;gap:12px;color:var(--muted);padding:7px 0;font-size:13px}
.think b{font-family:var(--display);color:var(--green);font-weight:700}
.ask-card{background:rgba(75,57,23,.35);border:1px solid rgba(241,195,107,.55);border-radius:14px;padding:16px 18px;animation:enter .35s ease-out both}
.ask-card h3{margin:0 0 8px;font-family:var(--display);font-size:16px;color:#ffe0a0}
.ask-card pre.block{margin:0 0 14px;background:rgba(0,0,0,.25);border-color:rgba(241,195,107,.18)}
.ask-actions{display:flex;gap:9px}
.btn{border:0;border-radius:8px;padding:9px 18px;font-weight:600;font-size:12px;transition:transform .15s,background .2s}
.btn:active{transform:scale(.97)}
.btn.go{background:var(--green-2);color:#04140b}.btn.go:hover{background:var(--green)}
.btn.no{background:transparent;color:#ffb0a4;border:1px solid rgba(255,137,120,.45)}.btn.no:hover{background:var(--red-soft)}
.note{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px}.note code{font-family:var(--mono);color:#cbdccf}
.err{background:var(--red-soft);border:1px solid rgba(255,137,120,.35);color:#ffc0b7;border-radius:12px;padding:12px 16px;white-space:pre-wrap;word-break:break-word}
.composer{padding:12px 28px 22px;background:linear-gradient(transparent,rgba(7,19,15,.98) 24%)}
.box{max-width:900px;margin:0 auto;background:rgba(16,36,26,.98);border:1px solid var(--line-strong);border-radius:15px;display:flex;align-items:flex-end;gap:10px;padding:9px 9px 9px 17px;transition:border-color .2s,box-shadow .2s;box-shadow:0 12px 35px rgba(0,0,0,.18)}
.box:focus-within{border-color:rgba(114,214,154,.55);box-shadow:0 0 0 3px rgba(114,214,154,.08),0 12px 35px rgba(0,0,0,.18)}
.box textarea{flex:1;border:0;outline:0;resize:none;font:inherit;font-size:13px;color:var(--ink);background:transparent;max-height:180px;padding:8px 0;line-height:1.6}
.box textarea::placeholder{color:#718b79}
.send{width:40px;height:40px;border-radius:10px;border:0;background:var(--green);color:#062013;display:grid;place-items:center;font-size:18px;transition:transform .2s,background .2s;flex:none}
.send:hover:not(:disabled){background:#9aebb5;transform:translateY(-2px)}
.send:disabled{background:#304a3a;color:#718b79;cursor:not-allowed}.send.stop{background:var(--red);color:#2a0905}
.hint{max-width:900px;margin:8px auto 0;font-size:10.5px;color:var(--muted-2);text-align:center}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(3px);animation:fade .2s both;z-index:5}
.drawer{position:absolute;top:0;right:0;bottom:0;width:min(680px,94%);background:#08140e;color:#d5e8d9;z-index:6;display:flex;flex-direction:column;animation:slidein .3s ease-out both;box-shadow:-20px 0 60px rgba(0,0,0,.4);border-left:1px solid var(--line)}
.drawer header{display:flex;align-items:center;gap:12px;padding:15px 18px;border-bottom:1px solid var(--line)}
.drawer header span{font-family:var(--mono);font-size:11px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drawer pre{margin:0;padding:18px 20px;overflow:auto;flex:1;font-family:var(--mono);font-size:11.5px;line-height:1.7;tab-size:4}
@keyframes slidein{from{transform:translateX(100%)}to{transform:none}}@keyframes fade{from{opacity:0}to{opacity:1}}
.offline{background:#7f2d24;color:#fff;text-align:center;padding:7px;font-size:12px}
.tree::-webkit-scrollbar,.scroll::-webkit-scrollbar,.drawer pre::-webkit-scrollbar,pre::-webkit-scrollbar{width:7px;height:7px}
.tree::-webkit-scrollbar-thumb,.scroll::-webkit-scrollbar-thumb,.drawer pre::-webkit-scrollbar-thumb,pre::-webkit-scrollbar-thumb{background:#294536;border-radius:10px}
@media(max-width:980px){.app{grid-template-columns:250px minmax(0,1fr)}.starters{grid-template-columns:1fr;max-width:560px}.starter{min-height:unset}.starter:before{display:none}}
@media(max-width:760px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;width:280px;z-index:20;transform:translateX(-100%);transition:transform .3s;box-shadow:none}
  .side.show{transform:none;box-shadow:12px 0 35px rgba(0,0,0,.45)}
  .bar .menu{display:inline-block}
  .scroll,.composer,.bar{padding-left:14px;padding-right:14px}
  .scroll{padding-top:20px}
  .hero{padding-top:4vh}
  .hero h2{font-size:39px}
  .hero p{font-size:13px;padding:0 8px}
  .starters{margin-top:24px;gap:8px}
  .starter{padding:13px 14px}
  .feed{padding-left:25px}.pin{left:-25px}
  .tool-head{gap:7px;padding:11px}.tool-sum{display:none}
  .chip{font-size:10px;padding:5px 8px}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}

</style>

<body>
<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

const call = (path, opts = {}) =>
  fetch(path, { ...opts, headers: { 'X-Agent': '1', 'Content-Type': 'application/json' } }).then(r => r.json());
const post = (path, body = {}) => call(path, { method: 'POST', body: JSON.stringify(body) });

const STARTERS = [
  ['Build a student API', 'Create a Spring Boot project called student-api with a Student entity (name, age, email), build it, run it and test it.'],
  ['Add a new entity', 'Add a Product entity with name:String, price:Double, active:Boolean to my existing project, then build it.'],
  ['Explain my project', 'List the files in the workspace and explain how the project is structured.'],
];

/* ---------- logo: leaf on a coil spring ---------- */
function Spring({ size = 34, mode = '' , light = true }) {
  return (
    <svg className={'spring ' + mode} width={size} height={size * 64 / 44} viewBox="0 0 44 64" aria-hidden="true">
      <g className="coil">
        <path d="M22 12V16L10 22L34 30L10 38L34 46L10 54L22 58V62" fill="none"
          stroke={light ? '#E6F3E0' : '#10281F'} strokeWidth="5" strokeLinejoin="round" strokeLinecap="round" />
      </g>
      <path className="leaf" d="M22 12C22 2 34 0 40 4C38 14 28 16 22 12Z" fill="#2E9E5B" />
    </svg>
  );
}

/* ---------- tiny markdown: ``` blocks and `inline` ---------- */
function Rich({ text }) {
  const parts = text.split(/```(?:\w+)?\n?([\s\S]*?)```/g);
  return parts.map((p, i) => i % 2 ? <pre className="block" key={i}>{p.trim()}</pre> :
    p.trim() ? p.trim().split(/\n{2,}/).map((para, j) => (
      <p key={i + '-' + j}>{para.split(/(`[^`]+`)/g).map((s, k) =>
        s.startsWith('`') && s.endsWith('`') && s.length > 1 ? <code key={k}>{s.slice(1, -1)}</code> : s)}</p>
    )) : null);
}

function summary(name, args) {
  if (!args) return '';
  const first = args.command || args.path || args.project || args.name || args.directory || '';
  if (name === 'generate_crud') return `${args.project} · ${args.entity} (${args.fields})`;
  if (name === 'create_spring_boot_project') return `${args.name} [${args.dependencies || 'web,data-jpa,h2'}]`;
  return String(first);
}

function ToolCard({ call, result }) {
  const [open, setOpen] = useState(false);
  const failed = result && /^(ERROR|DENIED)/.test(result.result) ;
  const status = !result ? 'run' : failed ? 'bad' : 'ok';
  const label = { run: 'Running', ok: 'Done', bad: result && result.result.startsWith('DENIED') ? 'Denied' : 'Failed' }[status];
  return (
    <div className="item">
      <span className={'pin ' + status} />
      <div className={'tool' + (open ? ' open' : '')}>
        <button className="tool-head" onClick={() => setOpen(o => !o)} aria-expanded={open}>
          <span className="caret">▸</span>
          <span className="tool-name">{call.name.replace(/_/g, ' ')}</span>
          <span className="tool-sum">{summary(call.name, call.args)}</span>
          <span className={'badge ' + status}>{label}</span>
        </button>
        {!result && <div className="bar-run" />}
        <div className="tool-body"><div>
          <pre className="block">{result ? result.result : 'Waiting for the tool to finish…'}</pre>
        </div></div>
      </div>
    </div>
  );
}

function Approval({ ev, live, outcome, onAnswer }) {
  if (live) return (
    <div className="item">
      <span className="pin ask" />
      <div className="ask-card" role="alertdialog" aria-label="Approval needed">
        <h3>The agent needs your approval</h3>
        <pre className="block">{ev.what}</pre>
        <div className="ask-actions">
          <button className="btn go" autoFocus onClick={() => onAnswer(true)}>Allow</button>
          <button className="btn no" onClick={() => onAnswer(false)}>Deny</button>
        </div>
      </div>
    </div>
  );
  return (
    <div className="item">
      <span className={'pin ' + (outcome ? 'ok' : 'bad')} />
      <div className="note"><code>{ev.what.length > 70 ? ev.what.slice(0, 70) + '…' : ev.what}</code> {outcome ? 'allowed' : 'not allowed'}</div>
    </div>
  );
}

function FileTree({ files, fresh, onOpen }) {
  if (!files.length) return <div className="tree-empty">No files yet. Ask the agent to create a project and it will appear here.</div>;
  return (
    <div className="tree">
      {files.map(f => {
        const depth = f.path.split('/').length - 1;
        const name = f.path.split('/').pop();
        return f.dir
          ? <span key={f.path} className="node dir" style={{ paddingLeft: 8 + depth * 14 }}>{name}/</span>
          : <button key={f.path} title={f.path} className={'node file' + (fresh.has(f.path) ? ' fresh' : '')}
              style={{ paddingLeft: 8 + depth * 14 }} onClick={() => onOpen(f.path)}>{name}</button>;
      })}
    </div>
  );
}

function App() {
  const [events, setEvents] = useState([]);
  const [st, setSt] = useState({ busy: false, approvalId: -1, autoApprove: false, model: '…', serverRunning: false });
  const [offline, setOffline] = useState(false);
  const [files, setFiles] = useState([]);
  const [fresh, setFresh] = useState(new Set());
  const [viewer, setViewer] = useState(null);
  const [text, setText] = useState('');
  const [menu, setMenu] = useState(false);
  const lastId = useRef(0);
  const known = useRef(new Set());
  const scroller = useRef(null);
  const stick = useRef(true);

  const loadFiles = useCallback(async () => {
    try {
      const list = await call('/api/files');
      const now = new Set(list.filter(f => !f.dir).map(f => f.path));
      const added = new Set([...now].filter(p => known.current.size && !known.current.has(p)));
      known.current = now;
      setFiles(list);
      if (added.size) { setFresh(added); setTimeout(() => setFresh(new Set()), 1800); }
    } catch (e) {}
  }, []);

  useEffect(() => {
    let alive = true;
    loadFiles();
    const tick = async () => {
      try {
        const d = await call('/api/events?after=' + lastId.current);
        if (!alive) return;
        setOffline(false); setSt(d.state);
        if (d.events.length) {
          lastId.current = d.events[d.events.length - 1].id;
          const types = d.events.map(e => e.type);
          const r = types.lastIndexOf('reset');
          setEvents(prev => r >= 0 ? d.events.slice(r + 1) : [...prev, ...d.events]);
          if (types.includes('tool_result') || types.includes('done')) loadFiles();
        }
      } catch (e) { if (alive) setOffline(true); }
      if (alive) setTimeout(tick, 600);
    };
    tick();
    return () => { alive = false; };
  }, [loadFiles]);

  useEffect(() => {
    const el = scroller.current;
    if (el && stick.current) el.scrollTop = el.scrollHeight;
  }, [events, st.approvalId]);

  const onScroll = e => {
    const el = e.target;
    stick.current = el.scrollHeight - el.scrollTop - el.clientHeight < 120;
  };

  const send = async (msg) => {
    const t = (msg ?? text).trim();
    if (!t || st.busy) return;
    setText(''); stick.current = true;
    const r = await post('/api/task', { task: t });
    if (r.error) alert(r.error);
    else setSt(r);
  };
  const answer = allow => post('/api/approve', { allow });
  const openFile = async p => { setViewer({ path: p, content: 'Loading…' }); setViewer(await call('/api/file?path=' + encodeURIComponent(p))); };

  // build the feed
  const results = {}, outcomes = {};
  events.forEach(e => { if (e.type === 'tool_result') results[e.for] = e; if (e.type === 'approval_result') outcomes[e.for] = e.allow; });
  const last = events[events.length - 1];
  const thinking = st.busy && st.approvalId < 0 && last && (last.type === 'thinking' || last.type === 'user' || last.type === 'tool_result' || last.type === 'approval_result');
  const lastAssistant = [...events].reverse().find(e => e.type === 'assistant');
  const empty = events.length === 0;

  const feed = events.map(e => {
    switch (e.type) {
      case 'user': return <div className="item" key={e.id}><span className="pin you" /><div className="you-msg"><Rich text={e.text} /></div></div>;
      case 'assistant': return <div className="item" key={e.id}><span className="pin ok" /><div className={'bot-msg' + (lastAssistant === e && !st.busy ? ' reveal' : '')}><Rich text={e.text} /></div></div>;
      case 'tool_call': return <ToolCard key={e.id} call={e} result={results[e.id]} />;
      case 'approval': return <Approval key={e.id} ev={e} live={st.approvalId === e.id} outcome={outcomes[e.id]} onAnswer={answer} />;
      case 'error': return <div className="item" key={e.id}><span className="pin bad" /><div className="err"><b>Something went wrong.</b>{'\n'}{e.text}{'\n\n'}Check that Ollama is running and the model supports tools, then send your message again.</div></div>;
      default: return null;
    }
  });

  return (
    <div className="app">
      <aside className={'side' + (menu ? ' show' : '')}>
        <div className="brand">
          <Spring size={34} mode={st.busy ? 'bounce' : ''} />
          <div><h1>SpringBoot Agent</h1><small>by Vetrivel Balakrishnan</small></div>
        </div>
        <div className="side-head"><h2>Project files</h2><button className="icon-btn" onClick={loadFiles}>Refresh</button></div>
        <FileTree files={files} fresh={fresh} onOpen={p => { setMenu(false); openFile(p); }} />
        <div className="side-foot">
          <label className="switch">
            <span>Run commands without asking</span>
            <input type="checkbox" checked={!!st.autoApprove} onChange={e => post('/api/settings', { autoApprove: e.target.checked }).then(setSt)} />
            <span className="track" />
          </label>
          <div className="credit">Built by <b>Vetrivel Balakrishnan</b><br />Runs locally with Ollama. No API key.</div>
        </div>
      </aside>

      <main className="main">
        {offline && <div className="offline">Lost connection to the agent. Restart SpringBootAgent.java and reload this page.</div>}
        <div className="bar">
          <button className="bar-btn menu" onClick={() => setMenu(m => !m)}>Files</button>
          <span className="chip"><span className={'dot ' + (offline ? 'off' : st.busy ? 'busy' : 'on')} />{offline ? 'Offline' : st.busy ? 'Working' : 'Ready'} · {st.model}</span>
          {st.serverRunning && <span className="chip"><span className="dot on" />App running on :8080</span>}
          <span className="spacer" />
          <button className="bar-btn" disabled={st.busy || empty} onClick={() => post('/api/reset').then(setSt)}>New chat</button>
        </div>

        <div className="scroll" ref={scroller} onScroll={onScroll}>
          <div className="col">
            {empty ? (
              <div className="hero">
                <Spring size={92} mode="drop" light={false} />
                <h2>SpringBoot Agent</h2>
                <p>Describe the Spring Boot API you want. I create the project, write the code, build it and test it.</p>
                <div className="byline">Built by <b>Vetrivel Balakrishnan</b></div>
                <div className="starters">
                  {STARTERS.map(([title, prompt]) => (
                    <button className="starter" key={title} onClick={() => send(prompt)}>
                      <strong>{title}</strong><span>{prompt}</span>
                    </button>
                  ))}
                </div>
              </div>
            ) : (
              <div className="feed">
                {feed}
                {thinking && (
                  <div className="item"><span className="pin run" />
                    <div className="think"><Spring size={22} mode="bounce" light={false} /><span><b>Thinking</b> through the next step…</span></div>
                  </div>
                )}
              </div>
            )}
          </div>
        </div>

        <div className="composer">
          <div className="box">
            <textarea rows={1} value={text} placeholder="Describe what to build, e.g. an Employee API with name, salary and department"
              onChange={e => { setText(e.target.value); e.target.style.height = 'auto'; e.target.style.height = e.target.scrollHeight + 'px'; }}
              onKeyDown={e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } }} />
            {st.busy
              ? <button className="send stop" aria-label="Stop the agent" onClick={() => post('/api/cancel')}>■</button>
              : <button className="send" aria-label="Send" disabled={!text.trim()} onClick={() => send()}>➤</button>}
          </div>
          <div className="hint">Enter to send · Shift+Enter for a new line</div>
        </div>

        {viewer && <>
          <div className="scrim" onClick={() => setViewer(null)} />
          <div className="drawer">
            <header><span>{viewer.path}</span><button className="icon-btn" onClick={() => setViewer(null)}>Close</button></header>
            <pre>{viewer.content}</pre>
          </div>
        </>}
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
